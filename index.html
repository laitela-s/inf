<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Price Tracker</title>
    <!-- Tailwind CSS (via CDN for prototype) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-50 text-gray-900 font-sans antialiased overflow-hidden h-screen flex">

    <!-- Mobile Overlay for Sidebar -->
    <div id="mobile-sidebar-overlay" style="display: none;" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden">
    </div>

    <!-- Sidebar (Filters) -->
    <aside id="sidebar"
        class="fixed inset-y-0 left-0 z-50 w-80 bg-white border-r border-gray-200 flex flex-col transform -translate-x-full md:translate-x-0 md:static md:flex transition-transform duration-300 ease-in-out">
        <div class="p-6 border-b border-gray-200 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-blue-600">농장 시세 조회</h1>
                <p class="text-xs text-gray-500 mt-1">시장 시세 현황</p>
            </div>
            <!-- Mobile Close Button -->
            <button id="close-sidebar" class="md:hidden text-gray-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </div>

        <div class="p-6 flex-1 overflow-y-auto space-y-6">
            <!-- Category Filter -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">물품 분류</label>
                <div class="flex space-x-2">
                    <button class="filter-btn active w-1/2 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition"
                        data-category="equip">장비</button>
                    <button class="filter-btn w-1/2 py-2 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200 transition"
                        data-category="acc">악세서리</button>
                </div>
            </div>

            <!-- Sort Order Filter (Sidebar) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">정렬 방식</label>
                <div class="flex space-x-2">
                    <button class="sidebar-sort-btn active w-1/2 py-2 rounded-lg bg-blue-600 text-white font-medium text-xs transition shadow-sm"
                        data-sort="freq">🔥 빈도순</button>
                    <button class="sidebar-sort-btn w-1/2 py-2 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200 font-medium text-xs transition"
                        data-sort="korean">🔤 ㄱㄴㄷ순</button>
                </div>
            </div>

            <!-- Dynamic Filters (Injected by JS) -->
            <div id="dynamic-filters" class="space-y-4">
                <!-- Filters will be rendered here -->
            </div>
        </div>

        <div id="last-update-sidebar" class="mt-auto pt-6 border-t border-gray-100 text-[10px] text-gray-400">
            업데이트: 로딩 중...<br>
            프로토타입 v0.1
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative w-full bg-gray-50">
        <!-- Header (스크롤 맨 위 상단바) -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-3 md:px-8 shadow-sm">
            <div class="flex items-center gap-2 md:gap-3 min-w-0">
                <!-- Mobile Menu Button -->
                <button id="open-sidebar" class="md:hidden text-gray-500 hover:text-gray-900 p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <h2 class="text-base md:text-lg font-semibold truncate" id="page-title">전체 아이템</h2>
            </div>

            <!-- Top Bar Controls (정렬방식 드롭다운 선택 메뉴 & 업데이트 날짜) -->
            <div class="flex items-center gap-2 md:gap-3 flex-shrink-0">
                <!-- Sort Dropdown Menu (상단바를 열어 정렬방식 선택) -->
                <div class="relative" id="sort-dropdown-wrapper">
                    <button id="sort-dropdown-toggle" type="button"
                        class="flex items-center gap-1.5 px-2.5 md:px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs md:text-sm font-semibold border border-gray-200 transition shadow-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <svg class="w-3.5 h-3.5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path>
                        </svg>
                        <span id="current-sort-text">정렬: 빈도순</span>
                        <svg id="sort-dropdown-icon" class="w-3.5 h-3.5 text-gray-400 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <!-- Dropdown Panel -->
                    <div id="sort-dropdown-menu"
                        class="hidden absolute right-0 mt-2 w-44 bg-white rounded-xl shadow-xl border border-gray-100 py-1.5 z-50">
                        <div class="px-3 py-1.5 text-[11px] font-bold text-gray-400 uppercase tracking-wider border-b border-gray-100">
                            정렬 방식 선택
                        </div>
                        <button class="sort-select-option w-full text-left px-3.5 py-2 text-xs font-medium hover:bg-blue-50 flex items-center justify-between transition text-blue-600 bg-blue-50/50" data-sort="freq">
                            <span class="flex items-center gap-1.5">🔥 빈도순 (거래량순)</span>
                            <span class="sort-check text-blue-600 font-bold" id="check-freq">✓</span>
                        </button>
                        <button class="sort-select-option w-full text-left px-3.5 py-2 text-xs font-medium hover:bg-blue-50 flex items-center justify-between transition text-gray-700" data-sort="korean">
                            <span class="flex items-center gap-1.5">🔤 ㄱㄴㄷ순 (이름순)</span>
                            <span class="sort-check text-blue-600 font-bold hidden" id="check-korean">✓</span>
                        </button>
                    </div>
                </div>

                <div class="hidden sm:block text-xs md:text-sm text-gray-500 whitespace-nowrap border-l border-gray-200 pl-3">
                    업데이트: <span id="last-update-header" class="text-gray-900 font-medium">로딩 중...</span>
                </div>
            </div>
        </header>

        <!-- Item Grid -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8">
            <!-- Gacha EV Calculator Banner (금도 & 다도 실시간 기대수익) -->
            <div id="gacha-ev-section" class="mb-6 hidden"></div>

            <div id="item-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- 아이템이 여기에 표시됩니다 -->
            </div>
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="modal-overlay" style="display: none;"
        class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden z-50 flex items-end md:items-center justify-center md:p-4">
        <div class="bg-white md:rounded-xl border-t md:border border-gray-200 shadow-2xl w-full max-w-5xl h-[90vh] md:h-auto md:max-h-[90vh] flex flex-col overflow-hidden transform transition-all translate-y-full md:translate-y-0 md:scale-95 md:opacity-0"
            id="modal-content">

            <!-- Modal Header -->
            <div class="p-4 md:p-6 border-b border-gray-100 bg-gray-50">
                <div class="flex justify-between items-start gap-3">
                    <div class="min-w-0 flex-1">
                        <div class="flex flex-wrap items-center gap-2" id="modal-title-row">
                            <h3 class="text-xl md:text-2xl font-bold text-gray-900 truncate" id="modal-title">
                                ITEM NAME
                            </h3>
                            <span class="text-xs md:text-sm px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-800 font-semibold"
                                id="modal-subtitle">SUB INFO</span>
                        </div>
                        <div id="modal-equip-badges" class="flex flex-wrap items-center gap-1.5 mt-1.5"></div>
                    </div>
                    <button id="close-modal" class="text-gray-400 hover:text-gray-900 transition flex items-center justify-center rounded-full hover:bg-gray-200 p-1 flex-shrink-0">
                        <svg class="w-7 h-7 md:w-8 md:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                            </path>
                        </svg>
                    </button>
                </div>
                <!-- Expandable Equipment & Option Detail Drawer -->
                <div id="equip-detail-drawer" class="mt-2.5 hidden"></div>
            </div>

            <!-- Modal Body -->
            <div id="modal-body-container" class="flex-1 overflow-y-auto lg:overflow-hidden flex flex-col lg:flex-row bg-white">

                <!-- Left: Matrix View (Equipment Only) or Info List -->
                <div
                    class="w-full lg:w-1/2 p-4 md:p-6 flex-shrink-0 lg:flex-shrink lg:overflow-y-auto border-b lg:border-b-0 lg:border-r border-gray-100 bg-gray-50/50">
                    <h4 class="text-sm font-bold text-gray-600 uppercase tracking-wider mb-3 flex items-center justify-between">
                        <span>시세표 (옵션 / 강화 / 내구도)</span>
                    </h4>
                    <div id="matrix-container" class="overflow-x-auto pb-4">
                        <!-- Matrix Table inject here -->
                        <div class="flex items-center justify-center h-64 text-gray-400">
                            아이템을 선택해주세요
                        </div>
                    </div>
                </div>

                <!-- Right: Chart & Stats & Enhancement Optimizer -->
                <div id="chart-section" class="w-full lg:w-1/2 p-4 md:p-6 flex flex-col bg-white flex-shrink-0 lg:flex-shrink lg:overflow-y-auto">
                    <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
                        <h4 class="text-sm font-bold text-gray-600 uppercase tracking-wider">시세 변동 기록</h4>
                    </div>

                    <!-- Real-time Fair Market Value Briefing Card -->
                    <div id="market-summary-card" class="hidden mb-3 rounded-xl border border-blue-100 bg-gradient-to-r from-blue-50/80 via-indigo-50/40 to-white p-3.5 shadow-sm">
                    </div>

                    <!-- Chart Area (위) -->
                    <div class="flex-1 bg-white rounded-lg p-2 md:p-4 relative min-h-[260px] md:min-h-[300px] border border-gray-100 shadow-sm">
                        <canvas id="priceChart"></canvas>
                        <div id="chart-placeholder"
                            class="absolute inset-0 flex items-center justify-center text-gray-400 text-sm p-4 text-center">
                            위 시세표의 옵션/스펙을 터치하여 상세 기록을 확인하세요
                        </div>
                    </div>

                    <!-- Enhancement Expected Value & Optimal Protection Card (아래) -->
                    <div id="enhance-sim-card" class="hidden mt-3 rounded-xl border border-blue-100 bg-gradient-to-r from-blue-50/80 via-indigo-50/40 to-white p-3.5 shadow-sm">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js" onerror=""></script>
    <script src="app.js?v=20261029_13"></script>
</body>

</html>
